<div class="layout-wrapper">


    <!-- =====================================================
         MOBILE OVERLAY
    ====================================================== -->

    <div
        class="overlay"
        *ngIf="mobileSidebarOpen"
        (click)="closeMobileSidebar()">
    </div>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"

        [class.collapsed]="sidebarCollapsed"

        [class.mobile-open]="mobileSidebarOpen">


        <!-- LOGO -->

        <div class="logo-section">

            <img
                src="/img/favicon-tr.png"
                alt="ZECO Help Desk">

            <div
                class="logo-text"
                *ngIf="!sidebarCollapsed">

                <h6>
                    zeco help desk
                </h6>

                <span>
                    Technician Panel
                </span>

            </div>

        </div>


        <!-- MENU -->

        <ul class="menu">


            <!-- DASHBOARD -->

            <li
                routerLink="dashboard"
                routerLinkActive="active"
                (click)="closeMobileSidebar()">

                <i class="fa-solid fa-gauge"></i>

                <span *ngIf="!sidebarCollapsed">
                    Dashboard
                </span>

            </li>


            <!-- ASSIGNMENTS -->

            <li
                routerLink="assignments"
                routerLinkActive="active"
                (click)="closeMobileSidebar()">

                <i class="fa-solid fa-list-check"></i>

                <span *ngIf="!sidebarCollapsed">
                    Assignments
                </span>

            </li>


            <!-- NOTIFICATIONS -->

            <li
                routerLink="notifications"
                routerLinkActive="active"
                (click)="closeMobileSidebar()">

                <i class="fa-regular fa-bell"></i>

                <span *ngIf="!sidebarCollapsed">
                    Notifications
                </span>

            </li>


            <!-- PROFILE -->

            <li
                routerLink="profile"
                routerLinkActive="active"
                (click)="closeMobileSidebar()">

                <i class="fa-solid fa-user"></i>

                <span *ngIf="!sidebarCollapsed">
                    Profile
                </span>

            </li>


            <!-- LOGOUT -->

            <li
                class="logout-item"
                (click)="logout()">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span *ngIf="!sidebarCollapsed">
                    Logout
                </span>

            </li>

        </ul>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <div class="main-content">


        <!-- =================================================
             TOPBAR
        ================================================== -->

        <header class="topbar">


            <!-- LEFT -->

            <div class="left-section">


                <!-- MOBILE -->

                <button
                    class="mobile-btn"
                    type="button"
                    (click)="toggleMobileSidebar()">

                    <i class="fa-solid fa-bars"></i>

                </button>


                <!-- DESKTOP -->

                <button
                    class="collapse-btn"
                    type="button"
                    (click)="toggleSidebar()">

                    <i class="fa-solid fa-bars"></i>

                </button>


                <div>

                    <h2>
                        Technician Panel
                    </h2>

                    <p>
                        Manage your field assignments
                    </p>

                </div>

            </div>


            <!-- RIGHT -->

            <div class="right-section">


                <!-- NOTIFICATION -->

                <button
                    class="notification-btn"
                    type="button"
                    routerLink="notifications">

                    <i class="fa-regular fa-bell"></i>

                </button>


                <!-- USER -->

                <div
                    class="profile"
                    *ngIf="technician">


                    <img
                        [src]="profileImage"
                        alt="Profile Photo">


                    <div class="profile-info">

                        <h4>
                            {{technician.fullName}}
                        </h4>

                        <span>
                            {{technician.role}}
                        </span>

                    </div>

                </div>


                <!-- PROFILE LOADING -->

                <div
                    class="profile-loading"
                    *ngIf="
                        !technician &&
                        loadingProfile
                    ">

                    <i
                        class="fa-solid fa-spinner fa-spin">
                    </i>

                </div>

            </div>

        </header>


        <!-- =================================================
             CHILD PAGES
        ================================================== -->

        <div class="page-content">

            <router-outlet></router-outlet>

        </div>

    </div>

</div>
