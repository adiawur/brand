<div class="profile-page">

    <!-- PROFILE CARD -->

    <div class="profile-card">

        <div class="profile-header">

            <img [src]="admin.image">

            <div>

                <h2>{{admin.fullName}}</h2>

                <span>{{admin.role}}</span>

            </div>

        </div>

        <button class="upload-btn">

            <i class="fa-solid fa-camera"></i>

            Change Photo

        </button>

    </div>

    <!-- DETAILS CARD -->

    <div class="details-card">

        <div class="card-header">

            <h3>Profile Information</h3>

            <button
                *ngIf="!editMode"
                class="edit-btn"
                (click)="toggleEdit()">

                <i class="fa-solid fa-pen"></i>

                Edit Profile

            </button>

        </div>

        <div class="form-grid">

            <!-- FULL NAME -->

            <div class="form-group">

                <label>Full Name</label>

                <input
                    [(ngModel)]="admin.fullName"
                    [readonly]="!editMode">

            </div>

            <!-- USERNAME -->

            <div class="form-group">

                <label>Username</label>

                <input
                    [(ngModel)]="admin.username"
                    [readonly]="!editMode">

            </div>

            <!-- EMAIL -->

            <div class="form-group">

                <label>Email Address</label>

                <input
                    [(ngModel)]="admin.email"
                    [readonly]="!editMode">

            </div>

            <!-- PHONE -->

            <div class="form-group">

                <label>Phone Number</label>

                <input
                    [(ngModel)]="admin.phone"
                    [readonly]="!editMode">

            </div>

            <!-- ROLE -->

            <div class="form-group">

                <label>Role</label>

                <input
                    [value]="admin.role"
                    readonly>

            </div>

            <!-- DEPARTMENT -->

            <div class="form-group">

                <label>Department</label>

                <input
                    [(ngModel)]="admin.department"
                    [readonly]="!editMode">

            </div>

        </div>

        <div
            class="actions"
            *ngIf="editMode">

            <button
                class="cancel-btn"
                (click)="toggleEdit()">

                Cancel

            </button>

            <button
                class="save-btn"
                (click)="saveProfile()">

                Save Changes

            </button>

        </div>

    </div>

    <!-- PASSWORD CARD -->

    <div class="password-card">

        <h3>Change Password</h3>

        <div class="password-grid">

            <div class="form-group">

                <label>Current Password</label>

                <input type="password">

            </div>

            <div class="form-group">

                <label>New Password</label>

                <input type="password">

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input type="password">

            </div>

        </div>

        <button class="save-btn">

            Update Password

        </button>

    </div>

</div>
