<div class="notifications-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="page-header">

        <div>

            <h2>
                Notifications
            </h2>

            <p>
                Monitor incidents, technician updates and SLA alerts
            </p>

        </div>


        <div class="header-actions">

            <button
                class="mark-btn"
                (click)="markAllRead()"
                [disabled]="
                    notifications.length === 0
                ">

                <i class="fa-solid fa-check-double"></i>

                Mark All Read

            </button>


            <button
                class="clear-btn"
                (click)="clearAll()"
                [disabled]="
                    notifications.length === 0
                ">

                <i class="fa-solid fa-trash"></i>

                Clear All

            </button>

        </div>

    </div>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
        class="error-card"
        *ngIf="errorMessage">

        <i
            class="fa-solid fa-circle-exclamation">
        </i>

        <div>

            <strong>
                Unable to load notifications
            </strong>

            <p>
                {{ errorMessage }}
            </p>

        </div>

        <button
            (click)="retry()">

            Retry

        </button>

    </div>


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div
        class="loading-card"
        *ngIf="loading">

        <i
            class="fa-solid fa-spinner fa-spin">
        </i>

        <span>
            Loading notifications...
        </span>

    </div>


    <!-- =====================================================
         EMPTY
    ====================================================== -->

    <div
        class="empty-card"
        *ngIf="
            !loading &&
            !errorMessage &&
            notifications.length === 0
        ">

        <div class="empty-icon">

            <i
                class="fa-regular fa-bell">
            </i>

        </div>

        <h3>
            No Notifications
        </h3>

        <p>
            You're all caught up. New notifications will appear here.
        </p>

    </div>


    <!-- =====================================================
         NOTIFICATIONS
    ====================================================== -->

    <div
        class="notification-list"
        *ngIf="
            !loading &&
            !errorMessage &&
            notifications.length > 0
        ">


        <div
            class="notification-card"

            *ngFor="
                let notification
                of notifications
            "

            [class.unread]="
                !notification.read
            ">


            <!-- =================================================
                 ICON
            ================================================== -->

            <div
                class="icon"

                [ngClass]="
                    getTypeClass(
                        notification.type
                    )
                ">

                <i
                    class="fa-solid"

                    [ngClass]="{

                        'fa-bolt':
                            notification.type === 'NEW_INCIDENT',

                        'fa-clock':
                            notification.type === 'SLA_ALERT',

                        'fa-user-gear':
                            notification.type === 'TECHNICIAN_UPDATE',

                        'fa-circle-check':
                            notification.type === 'RESOLVED',

                        'fa-triangle-exclamation':
                            notification.type === 'ESCALATED',

                        'fa-bell':
                            notification.type === 'GENERAL'

                    }">

                </i>

            </div>


            <!-- =================================================
                 CONTENT
            ================================================== -->

            <div class="content">

                <div class="top-row">

                    <h4>

                        {{ notification.title }}

                        <span
                            class="unread-dot"
                            *ngIf="
                                !notification.read
                            ">
                        </span>

                    </h4>

                    <span class="time">

                        {{ notification.time }}

                    </span>

                </div>


                <p>

                    {{ notification.message }}

                </p>

            </div>


            <!-- =================================================
                 ACTIONS
            ================================================== -->

            <div class="actions">


                <!-- MARK READ -->

                <button
                    *ngIf="
                        !notification.read
                    "

                    class="read-btn"

                    title="Mark as read"

                    (click)="
                        markAsRead(notification)
                    ">

                    <i
                        class="fa-solid fa-check">
                    </i>

                </button>


                <!-- DELETE -->

                <button
                    class="delete-btn"

                    title="Remove notification"

                    (click)="
                        deleteNotification(
                            notification.id
                        )
                    ">

                    <i
                        class="fa-solid fa-trash">
                    </i>

                </button>

            </div>

        </div>

    </div>

</div>
