<div class="page-wrapper">

    <!-- LEFT -->

    <div class="main-card">

        <div class="page-header">

            <div>
                <h2>Report New Incident</h2>
                <p>
                    Fill all required information below
                </p>
            </div>

            <button class="location-btn"
                    (click)="detectLocation()">

                <i class="fa-solid fa-location-crosshairs"></i>

                Detect Again

            </button>

        </div>

        <form (ngSubmit)="submitIncident()">

  <div class="grid">

    <div class="form-group">
      <label>Reporter Name *</label>

      <input
        type="text"
        [(ngModel)]="incident.reporterName"
        name="reporterName"
        placeholder="Enter full name">
    </div>

    <div class="form-group">
      <label>Phone Number *</label>

      <input
        type="text"
        [(ngModel)]="incident.phone"
        name="phone"
        placeholder="+2557XXXXXXXX">
    </div>

  </div>

   <div class="grid">
    <div class="form-group">

    <label>Email (Optional)</label>

    <input
      type="email"
      [(ngModel)]="incident.email"
      name="email"
      placeholder="example@gmail.com">

  </div>

  <div class="form-group">

    <label>Incident Type</label>

    <select
      [(ngModel)]="incident.incidentType"
      name="incidentType"
      (change)="onIncidentTypeChange()">

      <option
        *ngFor="let type of incidentTypes"
        [value]="type">

        {{ type }}

      </option>

    </select>

  </div>
   </div>

  <div class="form-group">

    <label>Description *</label>

    <textarea
      rows="6"
      [(ngModel)]="incident.description"
      name="description"
      placeholder="Describe the incident">
    </textarea>

  </div>

  <div class="location-grid">

    <div class="form-group">

      <label>Detected Location</label>

      <div class="input-icon">

        <i
          class="fa-solid fa-location-dot">
        </i>

        <input
          [value]="location"
          readonly>

      </div>

    </div>

    <div class="form-group">

      <label>Nearby Landmark</label>

      <input
        type="text"
        [(ngModel)]="incident.landmark"
        name="landmark"
        placeholder="Near Kisauni Market">

    </div>

  </div>

  <div class="grid">

    <div class="form-group">

      <label>Latitude</label>

      <input
        [value]="latitude"
        readonly>

    </div>

    <div class="form-group">

      <label>Longitude</label>

      <input
        [value]="longitude"
        readonly>

    </div>

  </div>

  <div
    class="form-group"
    *ngIf="showImageUpload">

    <label>
      Photo Evidence *
    </label>

    <input
      type="file"
      accept="image/*"
      (change)="onFileSelected($event)">

    <small class="hint">

      Photo is required for
      safety incidents.

    </small>

  </div>

  <div class="actions">

    <button
      type="button"
      class="cancel-btn">

      Cancel

    </button>

    <button
      type="submit"
      class="submit-btn">

      <i
        class="fa-solid fa-paper-plane">
      </i>

      Submit Incident

    </button>

  </div>

</form>

    </div>

    <!-- RIGHT -->

    <div class="tips-card">

        <h3>

            <i class="fa-solid fa-lightbulb"></i>

            Reporting Tips

        </h3>

        <ul>

            <li>
                Provide accurate location details.
            </li>

            <li>
                Attach photo if available.
            </li>

            <li>
                Describe incident clearly.
            </li>

            <li>
                High-risk incidents are prioritized.
            </li>

        </ul>

        <div class="illustration">

            <i class="fa-solid fa-bolt"></i>

        </div>

    </div>

</div>
